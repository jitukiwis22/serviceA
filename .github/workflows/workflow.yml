name: Service A build and docker image

on:
  push:
    branches:
      - master

env:
  IMAGE_NAME: service-a

jobs:
  build-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: checkout source
        uses: actions/checkout@v4
      - name: setup java in vm
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build jar
        run: mvn clean package -DskipTests
      - name: Building docker image for service A
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:1.0.1 .
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}
      - name: deploy image to docker hub
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:1.0.1
